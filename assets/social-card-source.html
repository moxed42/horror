<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background:
      radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.08) 0, transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(245, 69, 69, 0.28) 0, transparent 60%),
      radial-gradient(circle at 100% 0, rgba(69, 89, 255, 0.18) 0, transparent 55%),
      #020308;
    color: #f6f6f9;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .fog {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 100%, rgba(245,69,69,0.15), transparent 60%);
  }
  .card {
    text-align: center;
    z-index: 1;
  }
  .skull {
    font-size: 108px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 40px rgba(245, 69, 69, 0.55));
  }
  .name {
    font-size: 72px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .name .final { color: #f54545; }
  .name .club { color: #ffb4c8; }
  .tagline {
    margin-top: 18px;
    font-size: 28px;
    color: #a2a2bf;
    letter-spacing: 0.02em;
  }
  .tagline strong { color: #f9d976; }
  .border {
    position: absolute;
    inset: 18px;
    border: 2px solid rgba(245, 69, 69, 0.35);
    border-radius: 24px;
  }
</style>
</head>
<body>
  <div class="fog"></div>
  <div class="border"></div>
  <div class="card">
    <div class="skull">💀</div>
    <div class="name"><span class="final">Final Girls</span> <span class="club">Book Club</span></div>
    <div class="tagline"><strong>__TAGLINE__</strong></div>
  </div>
</body>
</html>
