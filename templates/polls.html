<html lang="en">
<head>

  <style>
    :root {
      --bg: #04040a;
      --bg-alt: #0b0b17;
      --card-bg: #111221;
      --accent: #f54545;
      --accent-soft: #ffb4c8;
      --text-main: #f6f6f9;
      --text-muted: #a2a2bf;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
      --radius-lg: 20px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background:
        radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.06) 0, transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(245, 69, 69, 0.18) 0, transparent 60%),
        radial-gradient(circle at 100% 0, rgba(69, 89, 255, 0.14) 0, transparent 55%),
        #020308;
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 14px 40px;
      display: flex;
      justify-content: center;
    }
    .page { width: 100%; max-width: 1040px; }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      font-size: 0.82rem;
    }
    .site-nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
    }
    .site-nav a:hover { color: var(--accent-soft); }
    .site-nav a.active {
      color: var(--text-main);
      border-bottom-color: var(--accent);
    }
    .site-nav .visit-counter {
      margin-left: auto;
      display: flex;
      align-items: center;
      padding: 3px;
      background: rgba(4, 4, 16, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
    }
    .site-nav .visit-counter img { display: block; height: 18px; border-radius: 3px; opacity: 0.9; }
    h1 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 span:first-child { color: var(--accent); }
    h1 span:last-child { color: var(--accent-soft); }
    .subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 6px; }
    .last-updated { font-size: 0.76rem; color: var(--text-muted); margin-bottom: 14px; }
    .jump-nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      padding: 8px 10px;
      margin-bottom: 18px;
      background: rgba(4, 4, 10, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-size: 0.78rem;
    }
    .jump-nav a { color: var(--text-muted); text-decoration: none; }
    .jump-nav a:hover { color: var(--accent-soft); }
    .month-jump-nav {
      top: 40px;
      max-height: 64px;
      overflow-y: auto;
      font-size: 0.74rem;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (min-width: 700px) {
      .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .stat-card {
      background:
        radial-gradient(circle at top left, rgba(245, 69, 69, 0.2), transparent 60%),
        var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent-soft); }
    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .fact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 14px 0 30px;
    }
    .subsection-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-soft);
      margin-bottom: 12px;
    }
    .panel {
      background: var(--bg-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .trend-panel { margin-bottom: 30px; }
    .trend-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 100px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .trend-bar {
      flex: 1 0 8px;
      min-width: 8px;
      height: 100%;
      display: flex;
      align-items: flex-end;
      background: rgba(4, 4, 16, 0.5);
      border-radius: 3px;
      overflow: hidden;
    }
    .trend-bar-fill {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, rgba(255, 180, 200, 0.9), rgba(245, 69, 69, 0.7));
    }
    .trend-caption { margin-top: 8px; font-size: 0.74rem; color: var(--text-muted); }
    .fact {
      flex: 1;
      min-width: 260px;
      background: rgba(4, 4, 16, 0.6);
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      padding: 12px 14px;
      font-size: 0.85rem;
    }
    .fact .fact-label {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .year-heading {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent-soft);
      margin: 26px 2px 12px;
    }
    .year-heading:first-of-type { margin-top: 0; }
    .poll-card {
      background: var(--bg-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      scroll-margin-top: 60px;
    }
    .poll-month { font-weight: 700; font-size: 0.95rem; margin-bottom: 12px; }
    .poll-month-link { color: var(--text-main); text-decoration: none; }
    .poll-month-link:hover { color: var(--accent-soft); }
    .poll-columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }
    @media (min-width: 700px) {
      .poll-columns { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    }
    .poll-column { scroll-margin-top: 60px; }
    .poll-column-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 10px;
    }
    .poll-type-tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(245, 69, 69, 0.14);
      border: 1px solid rgba(245, 69, 69, 0.4);
      color: var(--accent-soft);
    }
    .poll-turnout { margin-left: auto; font-size: 0.76rem; color: var(--text-muted); }
    ul.bar-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 1fr 90px;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
    }
    .bar-label {
      color: var(--text-main);
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .poll-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex-shrink: 1;
    }
    .poll-author {
      color: var(--text-muted);
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 1;
    }
    .poll-winner-tag {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-left: 4px;
    }
    .bar-track {
      background: rgba(4, 4, 16, 0.7);
      border-radius: var(--radius-pill);
      height: 10px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .bar-fill {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, rgba(245, 69, 69, 0.55), rgba(255, 180, 200, 0.85));
      border-radius: var(--radius-pill);
    }
    .poll-bar-row.is-winner .bar-fill {
      background: linear-gradient(90deg, rgba(245, 69, 69, 1), rgba(255, 180, 200, 1));
    }
    .poll-bar-row.is-winner .bar-track {
      height: 14px;
      border-color: rgba(245, 69, 69, 0.6);
      box-shadow: 0 0 8px rgba(245, 69, 69, 0.5);
    }
    .poll-bar-row.is-winner .bar-label { font-weight: 700; }
    .bar-count { color: var(--accent-soft); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .note { margin-top: 26px; font-size: 0.78rem; color: var(--text-muted); }
  </style>
</head>
