  <style>
    :root {
      --bg: #04040a;
      --accent: #f54545;
      --accent-soft: #ffb4c8;
      --text-main: #f6f6f9;
      --text-muted: #a2a2bf;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --card-bg: #111221;
      --radius-lg: 20px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #020308;
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 14px 40px;
      display: flex;
      justify-content: center;
    }
    .page { width: 100%; max-width: 720px; }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 span:first-child { color: var(--accent); }
    h1 span:last-child { color: var(--accent-soft); }
    .back-link { margin-bottom: 24px; font-size: 0.85rem; }
    .back-link a { color: var(--accent-soft); }
    .year-heading {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent-soft);
      margin: 22px 2px 10px;
    }
    .year-heading:first-of-type { margin-top: 0; }
    ul.month-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .month-list li {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      transition: border-color 0.15s ease;
    }
    .month-list li:hover { border-color: rgba(245, 69, 69, 0.5); }
    .month-list a { color: var(--text-main); text-decoration: none; font-weight: 600; }
    .month-list a:hover { color: var(--accent-soft); }
    .month-list .winner {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 3px;
    }
    .month-list .winner::before {
      content: "🏆 ";
    }
  </style>
</head>
<body>
  <main class="page">
    <h1><span>Final Girls</span> <span>Book Club</span> — Archive</h1>
    <p class="back-link"><a href="../index.html">← Back to current month</a></p>
__ARCHIVE_SECTIONS__
  </main>
</body>
